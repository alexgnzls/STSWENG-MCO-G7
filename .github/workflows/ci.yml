
name: Web CI

on:
  push:
    branches:
      - dev-web
      - "feat/**"
      - "bugfix/**"
      - "chore/**"
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - dev-web

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate React Web App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Require approved PR branch naming
        if: github.event_name == 'pull_request'
        env: 
          SOURCE_BRANCH: ${{ github.head_ref}}
        shell: bash
        run: |
          if [[ ! "$SOURCE_BRANCH" =~ ^(feat|bugfix|chore|refactor|test|doc|release|hotfix)/.+$ ]]; then
            echo "::error::PR source branch '$SOURCE_BRANCH' must use an approved prefix (e.g. feat/D02-support-cases)."
            exit 1
          fi
          
      - name: Check required files and assets
        run: node scripts/check-repository.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
