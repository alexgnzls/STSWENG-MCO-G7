name: Basic Expo CI

on:
  push:
    branches:
      - "feat/**"
      - "bugfix/**"
      - "chore/**"
      - dev
  pull_request:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Expo Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo project
        run: npx expo-doctor

      - name: Type check
        run: npx tsc --noEmit
